<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>The Holy Quran — القرآن الكريم</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Google Fonts: Amiri (Arabic), Inter (UI), Noto Serif Ethiopic (Classical), Noto Sans Ethiopic (Modern) -->
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+Ethiopic:wght@400;500;600;700&family=Noto+Serif+Ethiopic:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    /* =========================================================
       THEME VARIABLES (Light Mode is Default)
       ========================================================= */
    :root {
      --bg: #0d0f12;
      --card-bg: #141822;
      --card-hover-bg: #1a202e;
      --border: rgba(212, 175, 55, 0.35);
      --border-hover: rgba(212, 175, 55, 0.6);
      --accent: #d4af37;
      --accent-hover: #f3cf65;
      --text: #f0f6fc;
      --text-muted: #8b949e;
      --page-width: 95vw;
      --page-max-width: 1350px;
      --transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);

      /* Adaptive Translation Drawer Theme — LIGHT MODE */
      --trans-bg: #f8fafc;
      --trans-border: rgba(212, 175, 55, 0.35);
      --trans-header-border: rgba(0, 0, 0, 0.08);
      --trans-card-bg: #ffffff;
      --trans-card-border: rgba(0, 0, 0, 0.08);
      --trans-card-hover: #f1f5f9;
      --trans-card-shadow: 0 4px 14px rgba(0, 0, 0, 0.05);
      --trans-title: #946f14;
      --trans-subtitle: #64748b;
      --trans-arabic: #0f172a;
      --trans-amharic: #1e293b;
      --trans-badge-bg: rgba(212, 175, 55, 0.16);
      --trans-badge-text: #82600e;
      --trans-badge-surah: #0f172a;
      --trans-close-btn: #475569;
      --trans-control-bg: rgba(0, 0, 0, 0.05);
      --trans-control-border: rgba(0, 0, 0, 0.1);
      --trans-shadow: 0 0 35px rgba(0, 0, 0, 0.25);
      --trans-scrollbar: rgba(212, 175, 55, 0.3);

      /* Right Drawer Theme (Surah Index) */
      --drawer-bg: #141822;
      --drawer-text: #f0f6fc;
      --drawer-subtext: #8b949e;
      --drawer-item-hover: rgba(212, 175, 55, 0.18);

      /* Typography Preferences */
      --amharic-font: 'Noto Serif Ethiopic', 'Abyssinica SIL', 'Nyala', serif;
      --amharic-font-size: 1.08rem;
    }

    /* =========================================================
       DARK MODE ADAPTATION
       ========================================================= */
    body.mode-dark {
      --bg: #050608;

      /* Translation Drawer — DARK MODE */
      --trans-bg: #10141d;
      --trans-border: rgba(212, 175, 55, 0.35);
      --trans-header-border: rgba(255, 255, 255, 0.08);
      --trans-card-bg: rgba(255, 255, 255, 0.035);
      --trans-card-border: rgba(255, 255, 255, 0.08);
      --trans-card-hover: rgba(255, 255, 255, 0.065);
      --trans-card-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
      --trans-title: #f3cf65;
      --trans-subtitle: #8b949e;
      --trans-arabic: #ffffff;
      --trans-amharic: #e2e8f0;
      --trans-badge-bg: rgba(212, 175, 55, 0.14);
      --trans-badge-text: #f3cf65;
      --trans-badge-surah: #ffffff;
      --trans-close-btn: #cbd5e1;
      --trans-control-bg: rgba(255, 255, 255, 0.06);
      --trans-control-border: rgba(255, 255, 255, 0.12);
      --trans-shadow: 0 0 40px rgba(0, 0, 0, 0.85);
      --trans-scrollbar: rgba(212, 175, 55, 0.25);

      --drawer-bg: #10141d;
      --drawer-text: #f0f6fc;
      --drawer-subtext: #8b949e;
    }
    body.mode-dark .quran-page {
      filter: invert(0.92) hue-rotate(180deg) contrast(1.12) brightness(0.92);
    }

    /* =========================================================
       SEPIA MODE ADAPTATION
       ========================================================= */
    body.mode-sepia {
      --bg: #181512;

      /* Translation Drawer — WARM SEPIA MODE */
      --trans-bg: #f4ecdc;
      --trans-border: rgba(180, 135, 45, 0.4);
      --trans-header-border: rgba(100, 70, 30, 0.12);
      --trans-card-bg: #fbf7ee;
      --trans-card-border: rgba(120, 90, 40, 0.15);
      --trans-card-hover: #f6efe0;
      --trans-card-shadow: 0 4px 14px rgba(60, 40, 15, 0.08);
      --trans-title: #7a5210;
      --trans-subtitle: #786854;
      --trans-arabic: #2a1f14;
      --trans-amharic: #382a1b;
      --trans-badge-bg: rgba(180, 135, 45, 0.18);
      --trans-badge-text: #6d4605;
      --trans-badge-surah: #2a1f14;
      --trans-close-btn: #5c4b37;
      --trans-control-bg: rgba(120, 90, 40, 0.08);
      --trans-control-border: rgba(120, 90, 40, 0.18);
      --trans-shadow: 0 0 35px rgba(60, 40, 15, 0.25);
      --trans-scrollbar: rgba(180, 135, 45, 0.35);

      --drawer-bg: #1c1813;
      --drawer-text: #faebd7;
      --drawer-subtext: #a89f91;
    }
    body.mode-sepia .quran-page {
      filter: sepia(0.4) contrast(1.05) brightness(0.95);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }

    /* Continuous Vertical Scroll Container */
    #scrollContainer {
      width: 100vw;
      height: 100vh;
      overflow-y: auto;
      overflow-x: hidden;
      scroll-behavior: smooth;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 14px;
      padding-bottom: 110px;
    }

    /* Custom Scrollbars */
    #scrollContainer::-webkit-scrollbar,
    .surah-list::-webkit-scrollbar {
      width: 6px;
    }
    #scrollContainer::-webkit-scrollbar-track,
    .surah-list::-webkit-scrollbar-track {
      background: transparent;
    }
    #scrollContainer::-webkit-scrollbar-thumb,
    .surah-list::-webkit-scrollbar-thumb {
      background: rgba(212, 175, 55, 0.25);
      border-radius: 999px;
    }
    #scrollContainer::-webkit-scrollbar-thumb:hover,
    .surah-list::-webkit-scrollbar-thumb:hover {
      background: var(--accent);
    }

    .trans-content::-webkit-scrollbar {
      width: 6px;
    }
    .trans-content::-webkit-scrollbar-track {
      background: transparent;
    }
    .trans-content::-webkit-scrollbar-thumb {
      background: var(--trans-scrollbar);
      border-radius: 999px;
    }

    /* Feed Container */
    #pagesFeed {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      gap: 8px;
    }

    /* Wide Quran Page Wrapper */
    .page-wrapper {
      width: var(--page-width);
      max-width: var(--page-max-width);
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      content-visibility: auto;
      contain-intrinsic-size: 1000px 1500px;
      scroll-margin-top: 14px;
    }

    .quran-page {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 12px;
      background-color: #fff;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.7);
      image-rendering: high-quality;
      min-height: 400px;
    }

    /* Smart Quran Page Number Badge (Arabic Surah Name + English Page) */
    .page-number-badge {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(14, 18, 25, 0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(212, 175, 55, 0.38);
      border-radius: 9999px;
      padding: 0.26rem 0.95rem;
      color: var(--accent);
      font-size: 0.82rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      z-index: 10;
      pointer-events: none;
      white-space: nowrap;
      transition: var(--transition);
      letter-spacing: 0.3px;
    }

    .page-wrapper:hover .page-number-badge {
      background: rgba(14, 18, 25, 0.96);
      border-color: var(--accent-hover);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7), 0 0 14px rgba(212, 175, 55, 0.25);
      color: var(--accent-hover);
    }

    .badge-surah {
      font-family: 'Amiri', serif;
      font-size: 1.05rem;
      color: #fff;
      direction: rtl;
    }

    .badge-dot {
      color: rgba(212, 175, 55, 0.6);
      font-size: 0.75rem;
    }

    .badge-en {
      font-family: 'Inter', sans-serif;
      font-size: 0.82rem;
      color: var(--accent-hover);
    }

    /* Floating Toolbar Container */
    .bottom-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      z-index: 50;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.35s ease;
      pointer-events: none;
    }

    .bottom-bar.hidden {
      transform: translateY(120%);
      opacity: 0;
    }

    /* Fixed-Width Solid Dock */
    .dock-container {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 9999px;
      padding: 0.35rem 0.75rem;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.85), 0 2px 8px rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      gap: 0.45rem;
      pointer-events: auto;
      position: relative;
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }

    .dock-container:hover {
      border-color: var(--border-hover);
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.95), 0 0 18px rgba(212, 175, 55, 0.18);
    }

    /* Micro Progress Bar */
    .progress-line {
      position: absolute;
      bottom: 0;
      left: 14px;
      right: 14px;
      height: 2px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent-hover));
      width: 0%;
      transition: width 0.3s ease;
      box-shadow: 0 0 6px var(--accent);
    }

    .dock-section {
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .dock-divider {
      width: 1px;
      height: 20px;
      background: rgba(255, 255, 255, 0.15);
      margin: 0 0.15rem;
    }

    /* Buttons */
    .btn {
      background: transparent;
      border: none;
      color: var(--text);
      cursor: pointer;
      padding: 0.4rem 0.65rem;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      transition: var(--transition);
      white-space: nowrap;
    }

    .btn:hover {
      background: rgba(212, 175, 55, 0.18);
      color: var(--accent-hover);
    }

    .btn-index, .btn-trans {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--accent);
    }

    .btn-icon {
      padding: 0.45rem;
      width: 34px;
      height: 34px;
      justify-content: center;
    }

    /* Fixed Page Pill Button */
    .btn-page-pill {
      background: rgba(212, 175, 55, 0.12);
      border: 1px solid rgba(212, 175, 55, 0.35);
      color: var(--accent-hover);
      padding: 0.3rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.84rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      cursor: pointer;
      transition: var(--transition);
      white-space: nowrap;
    }

    .btn-page-pill:hover,
    .btn-page-pill.active {
      background: rgba(212, 175, 55, 0.26);
      border-color: var(--accent);
    }

    .total-pages-label {
      color: var(--text-muted);
      font-weight: 400;
      font-size: 0.75rem;
    }

    /* Floating Page Scrubber Popover */
    .page-popover {
      background: #141822;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 0.85rem 1.1rem;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.9), 0 0 20px rgba(0, 0, 0, 0.7);
      width: 270px;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      opacity: 0;
      visibility: hidden;
      transform: translateY(8px) scale(0.96);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
      position: relative;
    }

    .page-popover.open {
      opacity: 1;
      visibility: visible;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    .page-popover::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%) rotate(45deg);
      width: 10px;
      height: 10px;
      background: #141822;
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }

    .popover-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .popover-title {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--accent);
    }

    .popover-input-wrap {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.82rem;
    }

    .popover-input {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      color: #fff;
      width: 48px;
      text-align: center;
      border-radius: 6px;
      padding: 0.2rem 0.3rem;
      font-size: 0.82rem;
      font-weight: 600;
    }

    .popover-input:focus {
      outline: 1px solid var(--accent);
    }

    .popover-slider {
      width: 100%;
      accent-color: var(--accent);
      height: 5px;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 99px;
    }

    /* Common Drawer Styles */
    .drawer {
      position: fixed;
      top: 0;
      bottom: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Right Drawer (Surah Index) */
    .drawer-right {
      right: 0;
      width: 340px;
      background: var(--drawer-bg);
      border-left: 1px solid var(--border);
      box-shadow: 0 0 40px rgba(0,0,0,0.85);
      transform: translateX(100%);
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), background 0.3s ease;
    }
    .drawer-right.open { transform: translateX(0); }

    /* =========================================================
       ADAPTIVE LEFT DRAWER (Amharic Translation Panel)
       ========================================================= */
    .drawer-left {
      left: 0;
      width: min(560px, 94vw);
      background: var(--trans-bg);
      border-right: 1px solid var(--trans-border);
      box-shadow: var(--trans-shadow);
      transform: translateX(-100%);
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }
    .drawer-left.open { transform: translateX(0); }

    .drawer-header {
      padding: 1.1rem 1.25rem 0.85rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: border-color 0.3s ease;
    }

    .drawer-left .drawer-header {
      border-bottom: 1px solid var(--trans-header-border);
    }

    .drawer-right .drawer-header {
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .drawer-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .drawer-left .drawer-title {
      color: var(--trans-title);
      font-family: 'Inter', sans-serif;
    }

    .drawer-subtitle {
      font-size: 0.75rem;
      font-weight: 400;
      margin-top: 2px;
      color: var(--trans-subtitle);
    }

    #transPageBadge {
      font-size: 0.8rem;
      color: var(--trans-badge-text);
      background: var(--trans-badge-bg);
      padding: 0.18rem 0.55rem;
      border-radius: 999px;
      font-weight: 600;
    }

    #btnCloseTrans {
      color: var(--trans-close-btn);
    }

    /* Smart Typography Toolbar inside Translation Drawer */
    .trans-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.45rem 1.25rem;
      background: var(--trans-control-bg);
      border-bottom: 1px solid var(--trans-header-border);
      font-size: 0.82rem;
    }

    .trans-tool-group {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .tool-btn {
      background: transparent;
      border: 1px solid var(--trans-control-border);
      color: var(--trans-amharic);
      padding: 0.2rem 0.55rem;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
    }

    .tool-btn:hover, .tool-btn.active {
      background: var(--trans-badge-bg);
      border-color: var(--trans-border);
      color: var(--trans-title);
    }

    .drawer-search {
      margin: 0.75rem 1rem;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      padding: 0.5rem 0.8rem;
      border-radius: 8px;
      color: #fff;
      font-family: inherit;
    }

    .drawer-search:focus {
      outline: 1px solid var(--accent);
    }

    .surah-list {
      flex: 1;
      overflow-y: auto;
      list-style: none;
      padding: 0.5rem;
    }

    .surah-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.6rem 0.8rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: var(--transition);
      color: var(--drawer-text);
    }

    .surah-item:hover {
      background: var(--drawer-item-hover);
      color: var(--accent-hover);
    }

    .surah-num {
      color: var(--drawer-subtext);
      font-size: 0.8rem;
      margin-right: 0.6rem;
    }

    .surah-name-ar {
      font-family: 'Amiri', serif;
      font-size: 1.15rem;
      color: inherit;
      direction: rtl;
    }

    .surah-page {
      font-size: 0.8rem;
      color: var(--accent);
    }

    /* Adaptive Translation Cards Area */
    .trans-content {
      flex: 1;
      overflow-y: auto;
      padding: 1rem 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
      user-select: text;
      -webkit-user-select: text;
    }

    .trans-card {
      background: var(--trans-card-bg);
      border: 1px solid var(--trans-card-border);
      border-radius: 12px;
      padding: 1rem 1.15rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      box-shadow: var(--trans-card-shadow);
      transition: var(--transition), background 0.3s ease, border-color 0.3s ease;
    }

    .trans-card:hover {
      background: var(--trans-card-hover);
      border-color: var(--trans-border);
    }

    .ayah-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--trans-badge-text);
      background: var(--trans-badge-bg);
      border-radius: 6px;
      padding: 0.2rem 0.55rem;
      width: fit-content;
      transition: background 0.3s ease, color 0.3s ease;
    }

    .ayah-badge .surah-ar {
      font-family: 'Amiri', serif;
      font-size: 1rem;
      color: var(--trans-badge-surah);
      margin: 0 0.2rem;
    }

    .ayah-arabic {
      font-family: 'Amiri', serif;
      font-size: 1.35rem;
      line-height: 2.1;
      direction: rtl;
      text-align: right;
      color: var(--trans-arabic);
      transition: color 0.3s ease;
    }

    .ayah-amharic {
      font-family: var(--amharic-font);
      font-size: var(--amharic-font-size);
      line-height: 1.8;
      color: var(--trans-amharic);
      direction: ltr;
      text-align: left;
      transition: color 0.3s ease, font-size 0.2s ease;
    }

    .trans-loading, .trans-error {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem 1rem;
      gap: 0.8rem;
      color: var(--trans-subtitle);
      text-align: center;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(212, 175, 55, 0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- Continuous Infinite Vertical Scroll Container -->
  <main id="scrollContainer">
    <div id="pagesFeed"></div>
  </main>

  <!-- Bottom Floating Toolbar -->
  <footer class="bottom-bar" id="bottomBar">
    <div class="page-popover" id="pagePopover">
      <div class="popover-header">
        <span class="popover-title">Jump to Page</span>
        <div class="popover-input-wrap">

    (function () {
      const TOTAL_PAGES = 604;
      const STORAGE_KEY = 'oxpc3_quran_page';

      // Ayah counts for each of the 114 Surahs

      // Surah names kept strictly Arabic
      const SURAHS = [
        { n: 1, name: "الفاتحة", page: 1 }, { n: 2, name: "البقرة", page: 2 },

        { n: 49, name: "الحجرات", page: 515 }, { n: 50, name: "ق", page: 518 },

        { n: 103, name: "العصر", page: 601 }, { n: 104, name: "الهمزة", page: 601 },

        { n: 107, name: "الماعون", page: 602 }, { n: 108, name: "الكوثر", page: 602 },
        { n: 109, name: "الكافرون", page: 603 }, { n: 110, name: "النصر", page: 603 },
        { n: 111, name: "المسد", page: 603 }, { n: 112, name: "الإخلاص", page: 604 },
        { n: 113, name: "الفلق", page: 604 }, { n: 114, name: "الناس", page: 604 }
      ];

      function getSurahNameForPage(p) {
        let surah = SURAHS[0];
        for (let i = 0; i < SURAHS.length; i++) {
          if (SURAHS[i].page <= p) surah = SURAHS[i];
          else break;
        }
        return surah.name;
      }

      // State
      let currentPage = parseInt(localStorage.getItem(STORAGE_KEY)) || 1;
      let themeMode = parseInt(localStorage.getItem(THEME_STORAGE_KEY)) || 0; // 0: Light, 1: Dark, 2: Sepia
      let amharicFontStyle = localStorage.getItem(FONT_STYLE_KEY) || 'serif';
      let amharicFontSize = parseFloat(localStorage.getItem(FONT_SIZE_KEY)) || 1.08;
      
      let hideTimeout = null;
      let isProgrammaticScroll = false;
      let isHoveringDock = false;
      
      let arabicTextMap = null;  // Loaded from ./qur-ar.txt
      let amharicTextMap = null; // Loaded from ./qur-am.txt
      const pageVersesCache = new Map();

      // Elements
      const scrollContainer = document.getElementById('scrollContainer');
      const pagesFeed = document.getElementById('pagesFeed');
      const bottomBar = document.getElementById('bottomBar');
      const dockContainer = document.getElementById('dockContainer');
      const progressFill = document.getElementById('progressFill');
      const pillPageText = document.getElementById('pillPageText');
      const btnPagePill = document.getElementById('btnPagePill');
      const pagePopover = document.getElementById('pagePopover');
      const popoverSlider = document.getElementById('popoverSlider');
      const popoverInput = document.getElementById('popoverInput');
      const btnFullscreen = document.getElementById('btnFullscreen');
      const btnTheme = document.getElementById('btnTheme');
      const btnIndex = document.getElementById('btnIndex');
      const btnTrans = document.getElementById('btnTrans');
      const surahDrawer = document.getElementById('surahDrawer');
      const transDrawer = document.getElementById('transDrawer');
      const transContent = document.getElementById('transContent');
      const transPageBadge = document.getElementById('transPageBadge');
      const surahList = document.getElementById('surahList');
      const searchSurah = document.getElementById('searchSurah');
      const btnFontSerif = document.getElementById('btnFontSerif');
      const btnFontSans = document.getElementById('btnFontSans');
      const btnSizeInc = document.getElementById('btnSizeInc');
      const btnSizeDec = document.getElementById('btnSizeDec');

      // Apply Theme
      function applyTheme(mode) {
        document.body.className = '';
        if (mode === 1) document.body.classList.add('mode-dark');
        if (mode === 2) document.body.classList.add('mode-sepia');
        localStorage.setItem(THEME_STORAGE_KEY, mode);
      }
      applyTheme(themeMode);

      // Apply Typography Preferences
      function updateTypography() {
        const root = document.documentElement;
        if (amharicFontStyle === 'sans') {
          root.style.setProperty('--amharic-font', "'Noto Sans Ethiopic', 'Kefa', system-ui, sans-serif");
          btnFontSans.classList.add('active');
          btnFontSerif.classList.remove('active');
        } else {
          root.style.setProperty('--amharic-font', "'Noto Serif Ethiopic', 'Abyssinica SIL', 'Nyala', serif");
          btnFontSerif.classList.add('active');
          btnFontSans.classList.remove('active');
        }
        root.style.setProperty('--amharic-font-size', `${amharicFontSize}rem`);
        localStorage.setItem(FONT_STYLE_KEY, amharicFontStyle);
        localStorage.setItem(FONT_SIZE_KEY, amharicFontSize);
      }
      updateTypography();

      // Typography Controls
      btnFontSerif.onclick = () => { amharicFontStyle = 'serif'; updateTypography(); };
      btnFontSans.onclick = () => { amharicFontStyle = 'sans'; updateTypography(); };
      btnSizeInc.onclick = () => {
        if (amharicFontSize < 1.6) {
          amharicFontSize = +(amharicFontSize + 0.08).toFixed(2);
          updateTypography();
        }
      };
      btnSizeDec.onclick = () => {
        if (amharicFontSize > 0.85) {
          amharicFontSize = +(amharicFontSize - 0.08).toFixed(2);
          updateTypography();
        }
      };

      // 1. Build Feed of 604 Pages
      const fragment = document.createDocumentFragment();
      for (let i = 1; i <= TOTAL_PAGES; i++) {
        const wrapper = document.createElement('div');
        wrapper.className = 'page-wrapper';
        wrapper.id = `page-${i}`;
        wrapper.dataset.page = i;

        const img = document.createElement('img');
        img.className = 'quran-page';
        img.alt = `Page ${i}`;
        img.dataset.src = getPageUrl(i);

        // Smart Modern Quran Page Number Badge (Arabic Surah Name + English Page)
        const badge = document.createElement('div');
        badge.className = 'page-number-badge';
        badge.innerHTML = `
          <span class="badge-surah">${getSurahNameForPage(i)}</span>
          <span class="badge-dot">•</span>
          <span class="badge-en">Page ${i}</span>
        `;

        wrapper.appendChild(img);
        wrapper.appendChild(badge);
        fragment.appendChild(wrapper);
      }
      pagesFeed.appendChild(fragment);

      // 2. Lazy Load Observer
      const imageObserver = new IntersectionObserver((entries, observer) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const img = entry.target;
            if (img.dataset.src) {
              img.src = img.dataset.src;
              delete img.dataset.src;
            }
            observer.unobserve(img);
          }
        });
      }, {
        root: scrollContainer,
        rootMargin: '1200px 0px 1200px 0px'
      });

      document.querySelectorAll('.quran-page').forEach(img => imageObserver.observe(img));

      // Universal Tanzil Text Parser
      function parseTanzilText(rawText) {
        const map = new Map();
        const lines = rawText.split(/\r?\n/).map(l => l.trim()).filter(l => l && !l.startsWith('#'));
        const hasDelimiters = lines.length > 0 && lines[0].includes('|');

        if (hasDelimiters) {
          lines.forEach(line => {
            const parts = line.split('|');
            if (parts.length >= 3) {
              const sura = parts[0].trim();
              const aya = parts[1].trim();
              const text = parts.slice(2).join('|').trim();
              map.set(`${sura}:${aya}`, text);
            }
          });
        } else {
          let lineIdx = 0;
          for (let s = 1; s <= 114; s++) {
            const count = SURAH_AYAH_COUNTS[s - 1];
            for (let a = 1; a <= count; a++) {
              if (lineIdx < lines.length) {
                map.set(`${s}:${a}`, lines[lineIdx]);
                lineIdx++;
              }
            }
          }
        }
        return map;
      }

      // Preload both Arabic (qur-ar.txt) and Amharic (qur-am.txt) files
      async function loadLocalTexts() {
        if (arabicTextMap && amharicTextMap) return true;
        try {
          const [arRes, amRes] = await Promise.all([
            fetch('./qur-ar.txt'),
            fetch('./qur-am.txt')
          ]);

          if (!arRes.ok || !amRes.ok) throw new Error('Files could not be loaded');

          const [arRaw, amRaw] = await Promise.all([arRes.text(), amRes.text()]);
          arabicTextMap = parseTanzilText(arRaw);
          amharicTextMap = parseTanzilText(amRaw);

          console.log(`✅ Loaded ${arabicTextMap.size} Arabic & ${amharicTextMap.size} Amharic verses from repository.`);
          return true;
        } catch (e) {
          console.warn('Could not load local qur-ar.txt or qur-am.txt:', e);
          return false;
        }
      }

      // Get list of verse keys for the page (e.g. ["1:1", "1:2"...])
      async function getPageVerses(page) {
        if (pageVersesCache.has(page)) return pageVersesCache.get(page);

        const storageKey = `page_keys_v1_${page}`;
        const localSaved = localStorage.getItem(storageKey);
        if (localSaved) {
          const parsed = JSON.parse(localSaved);
          pageVersesCache.set(page, parsed);
          return parsed;
        }

        const res = await fetch(`https://api.quran.com/api/v4/verses/by_page/${page}?fields=verse_key`);
        if (!res.ok) throw new Error('Failed to get page keys');
        const data = await res.json();
        
        const verseList = data.verses.map(v => {
          const [sura, aya] = v.verse_key.split(':');
          return { key: v.verse_key, sura: parseInt(sura, 10), aya: parseInt(aya, 10) };
        });

        pageVersesCache.set(page, verseList);
        try { localStorage.setItem(storageKey, JSON.stringify(verseList)); } catch (e) {}
        return verseList;
      }

      // Load Translation and Arabic side-by-side
      async function loadTranslation(page) {
        transPageBadge.innerText = `Page ${page}`;

        transContent.innerHTML = `
          <div class="trans-loading">
            <div class="spinner"></div>
            <span>Loading text and translation for Page ${page}...</span>
          </div>`;

        const filesOk = await loadLocalTexts();
        if (!filesOk) {
          transContent.innerHTML = `
            <div class="trans-error">
              <span>⚠️ Could not find qur-ar.txt or qur-am.txt.</span>
              <span style="font-size: 0.8rem;">Please make sure both files are uploaded in the root of your repository.</span>
              <button class="btn" style="border: 1px solid var(--border); margin-top: 0.5rem;" onclick="window.retryTranslation(${page})">Retry</button>
            </div>`;
          return;
        }

        try {
          const verses = await getPageVerses(page);
          renderVerseCards(verses);
        } catch (err) {
          transContent.innerHTML = `
            <div class="trans-error">
              <span>⚠️ Failed to retrieve verses for Page ${page}.</span>
              <span style="font-size: 0.8rem;">Please check your internet connection.</span>
              <button class="btn" style="border: 1px solid var(--border); margin-top: 0.5rem;" onclick="window.retryTranslation(${page})">Retry</button>
            </div>`;
        }
      }

      window.retryTranslation = loadTranslation;

      // Render Arabic Verse + Amharic Translation
      function renderVerseCards(verses) {
        if (!verses || verses.length === 0) {
          transContent.innerHTML = '<div class="trans-error">No verses found for this page.</div>';
          return;
        }

        transContent.innerHTML = '';
        verses.forEach(v => {
          const sInfo = SURAHS.find(s => s.n === v.sura);
          const arabicSurahName = sInfo ? sInfo.name : `سورة ${v.sura}`;
          const arText = arabicTextMap ? (arabicTextMap.get(v.key) || '') : '';
          const amText = amharicTextMap ? (amharicTextMap.get(v.key) || 'ትርጉም አልተገኘም') : '';

          const card = document.createElement('div');
          card.className = 'trans-card';
          card.innerHTML = `
            <div class="ayah-badge">
              <span>Surah</span>
              <span class="surah-ar">${arabicSurahName}</span>
              <span>(${v.sura})</span> : <span>Ayah ${v.aya}</span>
            </div>
            ${arText ? `<div class="ayah-arabic">${arText}</div>` : ''}
            <div class="ayah-amharic">${amText}</div>
          `;
          transContent.appendChild(card);
        });
      }

      // Update UI Indicators
      function updateIndicators(p) {
        currentPage = p;
        popoverSlider.value = p;
        popoverInput.value = p;
        pillPageText.innerText = `Page ${p}`;
        progressFill.style.width = `${(p / TOTAL_PAGES) * 100}%`;
        localStorage.setItem(STORAGE_KEY, p);

        if (transDrawer.classList.contains('open')) {
          loadTranslation(p);
        }
      }

      // 3. Current Page Tracking Observer
      const pageTracker = new IntersectionObserver((entries) => {
        if (isProgrammaticScroll) return;
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const pageNum = parseInt(entry.target.dataset.page, 10);
            updateIndicators(pageNum);
          }
        });
      }, {
        root: scrollContainer,
        threshold: 0.35
      });

      document.querySelectorAll('.page-wrapper').forEach(wrapper => pageTracker.observe(wrapper));

      // Scroll to a specific page
      function scrollToPage(p, smooth = true) {
        if (p === 1) {
          isProgrammaticScroll = true;
          updateIndicators(1);
          scrollContainer.scrollTo({
            top: 0,
            behavior: smooth ? 'smooth' : 'instant'
          });
          setTimeout(() => { isProgrammaticScroll = false; }, 600);
          return;
        }

        const target = document.getElementById(`page-${p}`);
        if (!target) return;

        isProgrammaticScroll = true;
        updateIndicators(p);

        const img = target.querySelector('img');
        if (img && img.dataset.src) {
          img.src = img.dataset.src;
          delete img.dataset.src;
        }

        target.scrollIntoView({
          behavior: smooth ? 'smooth' : 'instant',
          block: 'start'
        });

        setTimeout(() => { isProgrammaticScroll = false; }, 600);
      }

      function nextPage() {
        if (currentPage < TOTAL_PAGES) scrollToPage(currentPage + 1);
      }

      function prevPage() {
        if (currentPage > 1) scrollToPage(currentPage - 1);
      }

      // Populate Surah List (Surah Name is strictly Arabic)
      function renderSurahs(filter = '') {
        surahList.innerHTML = '';
        SURAHS
          .filter(s => s.name.includes(filter) || String(s.n).includes(filter))
          .forEach(s => {
            const li = document.createElement('li');
            li.className = 'surah-item';
            li.innerHTML = `
              <div>
                <span class="surah-num">${s.n}.</span>
                <span class="surah-name-ar">${s.name}</span>
              </div>
              <span class="surah-page">Page ${s.page}</span>
            `;
            li.onclick = () => {
              scrollToPage(s.page);
              surahDrawer.classList.remove('open');
            };
            surahList.appendChild(li);
          });
      }
      renderSurahs();

      // Smart Auto-Hide Controls on Scrolling
      function hideUI() {
        if (!isHoveringDock && !surahDrawer.classList.contains('open') && !transDrawer.classList.contains('open') && !pagePopover.classList.contains('open')) {
          bottomBar.classList.add('hidden');
        }
      }

      function showUI() {
        bottomBar.classList.remove('hidden');
        clearTimeout(hideTimeout);
        hideTimeout = setTimeout(hideUI, 2400);
      }

      // Auto-hide when scrolling
      scrollContainer.addEventListener('scroll', () => {
        pagePopover.classList.remove('open');
        btnPagePill.classList.remove('active');
        hideUI();
      }, { passive: true });

      window.addEventListener('mousemove', showUI);
      window.addEventListener('touchstart', showUI);

      // Keep dock visible on mouse hover
      dockContainer.addEventListener('mouseenter', () => {
        isHoveringDock = true;
        clearTimeout(hideTimeout);
      });
      dockContainer.addEventListener('mouseleave', () => {
        isHoveringDock = false;
        showUI();
      });

      // Toggle Floating Page Scrubber Popover
      btnPagePill.onclick = (e) => {
        e.stopPropagation();
        const isOpen = pagePopover.classList.toggle('open');
        btnPagePill.classList.toggle('active', isOpen);
      };

      // Close popover when clicking outside
      document.addEventListener('click', (e) => {
        if (!pagePopover.contains(e.target) && !btnPagePill.contains(e.target)) {
          pagePopover.classList.remove('open');
          btnPagePill.classList.remove('active');
        }
      });

      // Popover Events
      popoverSlider.oninput = e => scrollToPage(parseInt(e.target.value, 10));
      popoverInput.onchange = e => scrollToPage(parseInt(e.target.value, 10));

      // Navigation Buttons
      document.getElementById('btnNext').onclick = nextPage;
      document.getElementById('btnPrev').onclick = prevPage;

      // Theme Toggle (Light -> Dark -> Sepia)
      btnTheme.onclick = () => {
        themeMode = (themeMode + 1) % 3;
        applyTheme(themeMode);
      };

      // Fullscreen
      btnFullscreen.onclick = async () => {
        if (!document.fullscreenElement) {
          try {
            await document.documentElement.requestFullscreen();
            if (screen.orientation && screen.orientation.lock) {
              await screen.orientation.lock('landscape').catch(() => {});
            }
          } catch (e) {}
        } else {
          document.exitFullscreen();
        }
      };

      // Surah Drawer Toggle
      btnIndex.onclick = () => {
        transDrawer.classList.remove('open');
        surahDrawer.classList.toggle('open');
      };
      document.getElementById('btnCloseDrawer').onclick = () => surahDrawer.classList.remove('open');
      searchSurah.oninput = e => renderSurahs(e.target.value.trim());

      // Translation Drawer Toggle
      btnTrans.onclick = () => {
        surahDrawer.classList.remove('open');
        const isOpen = transDrawer.classList.toggle('open');
        if (isOpen) {
          loadTranslation(currentPage);
        }
      };
      document.getElementById('btnCloseTrans').onclick = () => transDrawer.classList.remove('open');

      // Keyboard navigation
      window.addEventListener('keydown', e => {
        if (e.target.tagName === 'INPUT') return;

        if (['ArrowRight', 'PageDown'].includes(e.code)) nextPage();
        else if (['ArrowLeft', 'PageUp'].includes(e.code)) prevPage();
        else if (e.key.toLowerCase() === 'f') btnFullscreen.click();
        else if (e.key === 'Escape') {
          surahDrawer.classList.remove('open');
          transDrawer.classList.remove('open');
          pagePopover.classList.remove('open');
          btnPagePill.classList.remove('active');
        }
      });

      // Initialize
      setTimeout(() => {
        scrollToPage(currentPage, false);
        showUI();
        loadLocalTexts(); // Preload both files in background
      }, 100);
    })();
  </script>
</body>
</html>
